#### Pickles

**Day 1:** Create a brine solution with 5% salt concentration, pack sliced cucumbers into clean jars, and cover them with the brine solution, leaving 1-2 cm headspace. Ensure all equipment and hands are sanitized to prevent contamination.

**Day 2:** Check the jars for any signs of fermentation, such as bubbles or a slightly sour smell, and verify that the cucumbers are fully submerged in the brine solution. If necessary, add more brine to maintain the headspace.

**Day 3:** Monitor the fermentation process, looking for increased bubble formation and a more pronounced sour smell, and check the jars for any signs of contamination, such as mold or sliminess. Discard any jars showing signs of contamination.

**Day 4:** Perform a mid-point check by gently burping the jars to release any built-up carbon dioxide, and taste the pickles to assess their sourness and crunchiness. If the pickles are too salty, consider diluting the brine solution with a small amount of water.

**Day 5:** Continue to monitor the fermentation process, checking for the desired level of sourness and crunchiness, and verify that the pickles are still fully submerged in the brine solution. If necessary, add more brine to maintain the headspace.

**Day 6:** Check the pickles for any signs of over-fermentation, such as a strong, unpleasant odor or a soft, mushy texture, and consider transferring the jars to the refrigerator to slow down the fermentation process if necessary. Discard any jars showing signs of over-fermentation.

**Day 7:** Perform a final readiness check by tasting the pickles and assessing their texture, and once satisfied, store the jars in the refrigerator to halt the fermentation process. Always check the pickles for any signs of spoilage before consumption, such as mold, sliminess, or an off smell.

#### Yoghurt

**Day 1:** Heat 1 liter of milk to 180°F (82°C) to denature the proteins, then cool it down to 110°F (43°C). Whisk in 2 tablespoons of plain yoghurt with live active cultures. Pour the mixture into clean jars, seal them, and place them in a warm environment (e.g., an oven with the light on) for 6–12 hours. Ensure all utensils are sanitized to prevent unwanted bacterial growth. Do not disturb the jars during this period.

#### Kefir (Milk)

**Day 1:** Add 1 tablespoon of milk kefir grains to 2 cups of fresh milk in a clean glass jar. Cover the jar with a breathable cloth or coffee filter secured with a rubber band to allow airflow while keeping contaminants out. Place the jar in a dark, room-temperature area (68–78°F) and let it ferment for 24 hours.

**Day 2:** Check the kefir for signs of fermentation, such as a thickened texture, a tangy aroma, and visible separation into curds and whey. Gently shake the jar and strain out the kefir grains using a plastic or nylon sieve (avoid metal). Transfer the finished kefir to a sealed jar and refrigerate. Store the recovered grains in fresh milk to start a new batch.

#### Kefir (Water)

**Day 1:** Dissolve ½ cup of sugar in 4 cups of non-chlorinated water. Add ¼ cup of water kefir grains and a pinch of sea salt or a dried fig for mineral content. Pour the mixture into a clean glass jar, cover with a breathable cloth, and secure with a rubber band. Place it in a warm, dark spot (70–80°F) for the first fermentation.

**Day 2:** Check for signs of active fermentation, such as small bubbles rising and a faint yeasty, sweet smell. Gently swirl the jar to agitate the grains and ensure they are suspended in the sugar water. Do not remove the cloth covering. Verify that the liquid remains clear with no visible mold on the surface; discard if contamination is suspected.

**Day 3:** Assess the fizziness and taste the water kefir—it should be lightly effervescent and tangy, not overly sweet. Strain out the grains using a plastic or nylon strainer (avoid metal). Bottle the liquid in airtight flip-top bottles, leaving 1 inch of headspace, and refrigerate to halt fermentation. Use the harvested grains immediately for a new batch.

#### Kombucha (Primary Fermentation)

**Day 1:** Brew 1 gallon of strong black or green tea, dissolve 1 cup of sugar into it while hot, then cool to room temperature. Pour the sweet tea into a large glass brewing vessel, add your SCOBY (Symbiotic Culture Of Bacteria and Yeast) along with 1–2 cups of starter liquid from a previous batch. Cover with a breathable cloth and secure it. Place in a warm, dark location (75–80°F) and leave undisturbed.

**Days 2–7:** Observe the formation of a new translucent pellicle (SCOBY layer) on the surface. Check weekly for signs of fermentation, such as a vinegar-like aroma and the appearance of bubbles. Ensure the cloth cover remains clean and dry. If any fuzzy mold (green, black, or blue) appears on the surface, discard the entire batch immediately.

**Days 8–13:** Taste the kombucha every 2–3 days by carefully tilting the vessel and dripping a small amount through a straw. Monitor for the desired balance between sweet and tart. Continue to watch for a steady stream of bubbles and a deepening sourness. Top up with sterile water if evaporation lowers the liquid level significantly.

**Day 14:** Perform a final taste test to confirm the brew has reached your preferred tanginess—it should not taste like straight sweet tea. Reserve 2 cups of the finished liquid as starter for your next batch. Carefully remove the SCOBY and pellicle, placing them in a clean bowl with a little starter liquid. Proceed to bottle the remaining liquid for secondary fermentation or refrigerate it for a still, tart kombucha.

#### Kombucha (Secondary Fermentation)

**Day 1:** After primary fermentation, bottle the kombucha into airtight flip-top or screw-top bottles, adding 1–2 teaspoons of sugar, fruit juice, or chopped fruit per bottle for carbonation. Leave 1–2 inches of headspace. Seal the bottles tightly and store them at room temperature (70–75°F) away from direct sunlight.

**Day 2:** Check the bottles for the first signs of carbonation—the bottles should feel slightly firm when gently squeezed (if using plastic) or you may see small bubbles rising. Do not open the bottles yet; let the pressure build.

**Day 3:** Assess the fizziness by gently squeezing a plastic bottle if available. If using glass, carefully "burp" one bottle by slowly opening the cap to release a small amount of pressure, then reseal immediately. Taste a small sample to gauge the flavor development. If carbonation is weak, allow more time.

**Day 4:** Continue to monitor pressure buildup. The bottles should feel noticeably harder to the touch. If you used fruit, check for floating particles that could create nucleation points for excessive fizz. Keep bottles at room temperature; do not refrigerate yet unless carbonation is already at its peak.

**Day 5:** Perform a final carbonation check by carefully opening one test bottle—there should be a satisfying pop and visible effervescence. Taste for flavor and fizz. Once satisfied, immediately transfer all bottles to the refrigerator to stop fermentation and prevent over-carbonation or explosions. Always chill before opening to minimize foaming.

#### Natto

**Day 1:** Rinse 1 cup of soybeans and soak them in water for 12–18 hours until fully rehydrated. Steam or pressure-cook the beans until they are soft enough to easily crush between your fingers. In a sterile bowl, mix the warm beans with ⅛ teaspoon of natto starter powder (Bacillus subtilis) dissolved in a small amount of sterile water. Transfer the mixture to a shallow, clean container, cover with a lid with air holes, and place in a warm, humid environment (100–110°F) for 24 hours.

**Day 2:** Check for successful fermentation by looking for a whitish, stringy coating on the beans and a distinct earthy, nutty, or ammonia-like aroma. Gently stir the beans with a fork—they should develop long, sticky, gooey threads. If there is no stickiness or if an unpleasant rotten odor appears, discard the batch. Once confirmed, refrigerate the natto in a sealed container for at least 4–6 hours to mature the flavor before consuming.

#### Sauerkraut

**Day 1:** Finely shred 5 lbs of fresh cabbage and mix it with 3 tablespoons of non-iodized salt in a large bowl. Massage the cabbage vigorously for 8–10 minutes until it releases enough brine to cover itself. Pack the cabbage tightly into a clean fermentation crock or large jar, pressing down firmly to eliminate air pockets. Ensure the brine completely covers the cabbage by at least 1 inch. Place a weight on top to keep it submerged, cover loosely with a lid or cloth, and set it in a cool, dark place (65–70°F).

**Days 2–5:** Check daily to ensure the cabbage remains fully submerged under the brine. Push down the weight if needed. You should notice bubbles forming and a sour, tangy smell developing around day 3. Skim off any white foam or scum that may appear on the surface—this is normal, but mold is not. If any pink or fuzzy mold appears, remove it immediately along with the top layer of cabbage.

**Days 6–14:** Continue to monitor weekly. The brine may become cloudy, which is a sign of active fermentation. Taste a small sample every few days—it will progress from salty to mildly sour. Check the weight periodically and add a 2% salt brine (1 teaspoon salt per cup of water) if the liquid level drops below the cabbage.

**Days 15–20:** The kraut should now be distinctly sour and tangy. Bubbling will slow down significantly. Continue to check for proper submersion and skim any surface scum. Taste every 2–3 days to track the deepening flavor. If the room temperature rises above 70°F, consider moving it to a cooler spot to avoid softening the cabbage.

**Day 21:** Perform a final readiness check by tasting the sauerkraut—it should be pleasantly sour, crunchy, and full-flavored. Once satisfied, pack the kraut tightly into smaller jars, cover completely with brine, seal with airtight lids, and transfer to the refrigerator. Always check for off-smells, sliminess, or unusual colors before serving; discard if any are present.

#### Kimchi

**Day 1:** Cut 1 large Napa cabbage into bite-sized pieces and salt it thoroughly with ½ cup of coarse salt, massaging it into the leaves. Let it sit for 2–4 hours, turning occasionally, until the cabbage wilts and releases excess water. Rinse the cabbage 2–3 times under cold water to remove excess salt, then drain well. Prepare the paste by blending garlic, ginger, fish sauce, Korean chili flakes (gochugaru), and a little sugar. Mix the paste with the cabbage along with sliced radish, scallions, and carrot. Pack the mixture tightly into a clean glass jar, pressing down to remove air bubbles, and leave 1–2 inches of headspace.

**Day 2:** Check the kimchi for early fermentation signs—small bubbles should appear, and the liquid level may rise. Press down with a clean spoon to keep the vegetables submerged in their own brine. The jar will start to emit a pungent, garlicky, and slightly sour aroma. Keep the jar loosely covered or use a fermentation lid at room temperature.

**Day 3:** Monitor vigorously; the kimchi will become very active with frequent bubbling. Open the jar gently to "burp" it daily to release built-up carbon dioxide, or use an airlock. Taste a small piece—it should be spicy, salty, and just beginning to sour. If the top layer looks dry, press it down again.

**Day 4:** Continue to burp the jar once or twice daily. The sourness will become more pronounced, and the texture of the cabbage should still be crisp. Check for any surface mold—if present, discard the top layer and ensure the rest is fully submerged in brine. The refrigerator is not yet needed unless the room is very warm (above 75°F).

**Day 5:** Perform a mid-point taste test. The kimchi should now have a balanced sour-spicy profile. Bubbling may slow slightly. If it tastes too salty or raw, allow more time. If it tastes perfectly tangy, you may move it to the refrigerator now, but for a deeper flavor, continue at room temperature.

**Day 6:** Check for desired fermentation level. The kimchi should be effervescent, with a rich, complex tang and a slight fizz on the tongue. Press down any floating pieces. The aroma will be strong and characteristic. If the room is cool, fermentation may be milder; consider leaving it one more day.

**Day 7:** Perform a final readiness check by tasting a generous piece—the kimchi should be deeply sour, spicy, and umami-rich with a crunchy yet tender texture. Once satisfied, seal the jar tightly and transfer it to the refrigerator to slow fermentation. Always inspect for off-colors, sliminess, or an ammonia-like smell before eating, and discard if any are present.

#### Sourdough Starter

**Day 1:** In a clean glass jar, mix 100 grams of whole wheat or rye flour with 100 grams of lukewarm filtered water. Stir vigorously to incorporate air. Cover loosely with a lid or cloth and leave at room temperature (70–75°F) for 24 hours. No activity is expected yet—this is the initial hydration phase.

**Day 2:** Discard half of the mixture (about 100g) and add 100 grams of fresh flour and 100 grams of lukewarm water. Stir well and cover loosely. Check for the first signs of bacterial activity—a few tiny bubbles may appear, and the mixture may have a slightly sharp smell. Continue to leave at room temperature.

**Day 3:** Discard all but 100g of the starter and repeat the feeding with 100g flour and 100g water. You should now see more distinct bubbles across the surface and sides of the jar. The aroma may shift from pungent to slightly fruity or yeasty. If the surface dries out, cover more tightly.

**Day 4:** Perform the same discard-and-feed routine. The starter should double in volume within 4–8 hours of feeding if active. Look for a spongy, airy texture and a pleasant sour-milk smell. If there is no rise, continue feeding as scheduled; this is normal for slow-starting flours. Keep the jar in a warm spot, like near a turned-off oven with the light on.

**Day 5:** Feed as before. The starter should now rise predictably after each feeding, showing a domed top and a web of gluten strands when pulled with a spoon. Perform the "float test" by dropping a small amount into water—if it floats, it is ready. If not, continue feeding. Check for any pink, orange, or fuzzy mold and discard if present.

**Day 6:** Continue the feedings. The starter should become very active, with a strong, tangy, yeasty aroma and a resilient, stretchy consistency. It should double or even triple in volume within 6 hours of feeding. If it consistently rises and falls, your culture is strong and stable.

**Day 7:** Perform the final readiness test by feeding the starter and watching it double in 4–6 hours. It should have a complex sourdough smell, a bubbly, aerated crumb, and pass the float test easily. Once confirmed, the starter is ready to use for baking. Store it in the refrigerator in a sealed jar, and thereafter feed it weekly. Always check for any off-smells or discoloration before each use; discard and restart if contamination is suspected.

